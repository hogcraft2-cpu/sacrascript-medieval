[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sacrascript-medieval"
version = "0.1.0"
description = "Drafts of medieval-inspired prayers, blessings, sermons, and parish posts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
sacrascript = "sacrascript.cli:main"

[tool.setuptools]
packages = ["sacrascript"]
