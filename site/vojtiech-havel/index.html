function parchmentTexture(){const c=document.createElement('canvas');c.width=1024;c.height=1400;const x=c.getContext('2d');x.fillStyle='#d9c69d';x.fillRect(0,0,c.width,c.height);const grad=x.createRadialGradient(500,650,100,500,700,900);grad.addColorStop(0,'#e7d8b7');grad.addColorStop(.72,'#d8c49b');grad.addColorStop(1,'#aa9168');x.fillStyle=grad;x.fillRect(0,0,c.width,c.height);for(let i=0;i<27000;i++){const px=Math.random()*1024,py=Math.random()*1400;x.fillStyle=Math.random()>.5?'rgba(87,58,29,.055)':'rgba(255,245,210,.09)';x.fillRect(px,py,Math.random()*2+.3,Math.random()*2+.3)}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t}

function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function setOpenState(v){opened=v;document.querySelector('#hint').textContent=v?'Strony są puste — możemy później dodać kronikę':'Dotknij księgi, aby ją otworzyć';document.querySelector('#status').textContent=v?'Strona '+(turns*2+1)+'–'+(turns*2+2):'Okładka';document.querySelector('#prev').disabled=!v||turns===0;document.querySelector('#next').textContent=v?'Następna strona':'Otwórz księgę'}
function openBook(){if(opened||turning)return;turning=true;turnStart=clock.elapsedTime;turnFrom=0;turnTo=Math.PI;document.querySelector('#status').textContent='Otwieranie…'}
function turnPage(dir){if(!opened||turning)return;if(dir>0&&turns>=12)return;if(dir<0&&turns<=0)return;turning=true;turnStart=clock.elapsedTime;turnFrom=movingPivot.rotation.y;turnTo=dir>0?Math.PI:0;turns+=dir;document.querySelector('#status').textContent='Strona '+(turns*2+1)+'–'+(turns*2+2);document.querySelector('#prev').disabled=turns===0;document.querySelector('#next').disabled=turns===12}
